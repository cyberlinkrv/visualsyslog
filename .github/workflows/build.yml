name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
  linux:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      - run: bash packaging/build_deb.sh
      - uses: actions/upload-artifact@v4
        with: {name: visualsyslog-linux-amd64, path: dist/*.deb}
  windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[build]'
      - run: pyinstaller --clean --noconfirm packaging/visualsyslog.spec
      - run: choco install innosetup --yes --no-progress
      - run: iscc packaging\visualsyslog.iss
      - uses: actions/upload-artifact@v4
        with: {name: visualsyslog-windows-x64, path: dist/*.exe}
