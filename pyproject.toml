[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "visualsyslog"
version = "2.2.0"
description = "Cross-platform visual Syslog server with SQLite retention"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "VisualSyslog contributors"}]
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.29,<1"]

[project.optional-dependencies]
build = ["pyinstaller>=6.6,<7"]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
visualsyslog = "visualsyslog.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/visualsyslog"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
